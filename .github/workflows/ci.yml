name: CI

on:
  push:
    branches: [main, develop, "chore/**", "feat/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Mocked end-to-end demo
        run: npm run demo:local

      - name: Build
        run: npm run build

      # Hardhat compile is currently blocked on the v3 ESM requirement; the
      # contracts are example agents and not on the Tier 1 critical path.
      # Re-enable once we migrate the package to ESM (see ROADMAP) or pin to
      # hardhat v2.
      # - name: Hardhat compile
      #   run: npm run compile:contracts

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pull just the branch tip + a few merge-base commits; we do NOT want
      # to scan unreachable / cached PR refs from deleted branches.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Note: `--no-git` ignores .gitignore, so a local run with a populated
      # dist/ will also scan build output and double-report findings from the
      # source it was compiled from. CI checks out clean, so dist/ is absent
      # here — but that is why a local repro can show more hits than CI.
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --report-format sarif --report-path gitleaks.sarif

      - name: Scan reachable history (current branch only)
        # Limit to what is reachable from HEAD. The pre-merge ref cache on
        # GitHub can include deleted branches' commits if --all is used;
        # this stays focused on the actual code path being merged.
        run: gitleaks detect --source . --redact --log-opts="HEAD --full-history"

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

  dependency-audit:
    name: npm audit (warn-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: npm audit
        run: npm audit --omit=dev || true
